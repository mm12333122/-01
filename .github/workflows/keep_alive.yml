name: Keep Supabase Alive

on:
  schedule:
    # 每天 UTC 时间 0:00 (即北京/香港/新加坡时间 8:00 AM) 自动触发一次
    - cron: '0 0 * * *'
  # 支持在 GitHub 网页上手动点击测试
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -i -X GET "https://pziydvetnnyrmxoipbyv.supabase.co/rest/v1/lectures?select=id&limit=1" \
            -H "apikey: sb_publishable_Z2hWgnQg2RSNKpq2oMfoXw_ueDXZd81" \
            -H "Authorization: Bearer sb_publishable_Z2hWgnQg2RSNKpq2oMfoXw_ueDXZd81"
